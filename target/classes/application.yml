server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studex}
    username: ${SPRING_DATASOURCE_USERNAME:studex}
    password: ${SPRING_DATASOURCE_PASSWORD:studex_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:studex_redis}
      timeout: 5000ms

jwt:
  secret: ${JWT_SECRET:studex_jwt_secret_key_min_32_chars_long_for_hs256}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

logging:
  level:
    ru.studex: DEBUG
    org.springframework.security: WARN
