server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studex}
    username: ${SPRING_DATASOURCE_USERNAME:studex}
    password: ${SPRING_DATASOURCE_PASSWORD:studex_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_REDIS_PASSWORD:studex_redis}
      timeout: 5000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 110MB

upload:
  dir: ${UPLOAD_DIR:./uploads}

jwt:
  secret: ${JWT_SECRET:studex_jwt_secret_key_min_32_chars_long_for_hs256}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000

support:
  groq:
    # Получи бесплатный API-ключ на https://console.groq.com/keys
    api-key: ${GROQ_API_KEY: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}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-tokens: 500
    temperature: 0.3
  ollama:
    # Ollama запускается локально: https://ollama.com
    # После установки: ollama pull nomic-embed-text
    base-url: ${OLLAMA_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

oauth:
  redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}
  frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:5173}
  sber:
    client-id: ${SBER_CLIENT_ID:}
    client-secret: ${SBER_CLIENT_SECRET:}
    auth-url: https://online.sberbank.ru/CSAFront/oidc/authorize
    token-url: https://online.sberbank.ru/CSAFront/oidc/token
    userinfo-url: https://online.sberbank.ru/CSAFront/oidc/userinfo
    scope: openid name email mobile
    pkce: true
  tbank:
    client-id: ${TBANK_CLIENT_ID:}
    client-secret: ${TBANK_CLIENT_SECRET:}
    auth-url: https://id.tinkoff.ru/auth/authorize
    token-url: https://id.tinkoff.ru/auth/token
    userinfo-url: https://id.tinkoff.ru/userinfo/userinfo
    scope: openid profile email phone
    pkce: false
  alfa:
    client-id: ${ALFA_CLIENT_ID:}
    client-secret: ${ALFA_CLIENT_SECRET:}
    auth-url: https://id.alfabank.ru/oidc/authorize
    token-url: https://id.alfabank.ru/oidc/token
    userinfo-url: https://id.alfabank.ru/oidc/userinfo
    scope: openid profile email phone
    pkce: false

logging:
  level:
    ru.studex: DEBUG
    org.springframework.security: WARN
